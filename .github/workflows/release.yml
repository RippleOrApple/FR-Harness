name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Unit tests
        run: python -m pytest -v -p no:cacheprovider
      - name: Build one-file executable
        run: pyinstaller --clean fr-harness.spec
      - name: Smoke test executable
        shell: pwsh
        run: |
          .\dist\FR-Harness.exe --version
          .\dist\FR-Harness.exe demo
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item .\dist\FR-Harness.exe .\package\FR-Harness.exe
          Copy-Item ".\release\快速开始.txt" ".\package\快速开始.txt"
          Copy-Item ".\release\启动 FR-Harness.cmd" ".\package\启动 FR-Harness.cmd"
          Compress-Archive -Path .\package\* -DestinationPath .\release\FR-Harness-Windows-x64.zip
          $hash = (Get-FileHash .\release\FR-Harness-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  FR-Harness-Windows-x64.zip" | Set-Content .\release\FR-Harness-Windows-x64.zip.sha256 -Encoding ascii
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FR-Harness-Windows-x64
          path: |
            release/FR-Harness-Windows-x64.zip
            release/FR-Harness-Windows-x64.zip.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\release\FR-Harness-Windows-x64.zip" `
            ".\release\FR-Harness-Windows-x64.zip.sha256" `
            --verify-tag `
            --title "FR-Harness ${{ github.ref_name }}" `
            --generate-notes
